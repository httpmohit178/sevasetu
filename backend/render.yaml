services:
  - type: web
    name: sevasetu-api
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sevasetu-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
databases:
  - name: sevasetu-db
    region: singapore
    plan: basic-256mb
    databaseName: sevasetu
    user: sevasetu
